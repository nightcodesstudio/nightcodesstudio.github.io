<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Codes</title>
  <meta name="description" content="Night Codes makes games and apps.">
  <style>
    :root {
      --bg: #0d1017;
      --text: #e8e6e3;
      --muted: #9aa0aa;
      --accent: #8fa8ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: 0.02em;
      margin: 0 0 12px;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 1.125rem; margin: 0; }
    footer { position: fixed; bottom: 16px; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Night <span>Codes</span></h1>
    <p>Games and apps.</p>
  </main>
  <footer>&copy; 2026 Night Codes</footer>
</body>
</html>
